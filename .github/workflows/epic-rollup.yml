name: Epic Rollup

on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  epic-rollup:
    uses: vergil-project/vergil-actions/.github/workflows/ops-epic-rollup.yml@v2.1
    permissions:
      contents: read
    # The App keys live in the `automation` environment; environment secrets
    # reach a reusable workflow in another repo only through `inherit`.
    secrets: inherit
