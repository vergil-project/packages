name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: base
      container-tag: "latest"
    # The org GitHub App (APP_CLIENT_ID / APP_PRIVATE_KEY) dispatches
    # `package-released` to this repo's publish-index after a packaged release
    # (spec §8.2). The signing secrets come from the main-only
    # `package-signing` environment, not from here.
    secrets: inherit
