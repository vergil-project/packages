name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: base
    # `inherit` carries the `package-signing` environment's PACKAGE_SIGNING_KEY
    # to the reusable workflow's package-sign job: the callee is first-party
    # (vergil-project) and allow-listed for `inherit`. It also needs
    # APP_CLIENT_ID / APP_PRIVATE_KEY for the package-released dispatch (spec
    # §8.2). Across orgs, and to a repo's own local workflow, the App keys pass
    # by name instead; signed packages from a repository outside vergil-project
    # are tracked in vergil-project/.github#1592.
    secrets: inherit
