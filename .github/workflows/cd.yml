name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: base
      container-tag: "latest"
    # `inherit` (not an explicit map) is required: with an explicit map the
    # reusable workflow's package-sign job saw an empty PACKAGE_SIGNING_KEY from
    # its `package-signing` environment (vergil-project/packages#6). The callee
    # is first-party (same org); it also needs APP_CLIENT_ID / APP_PRIVATE_KEY
    # for the package-released dispatch (spec §8.2).
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
