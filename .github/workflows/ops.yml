name: Ops

on:
  schedule:
    - cron: '44 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    # The App keys live in the `automation` environment; environment secrets
    # reach a reusable workflow in another repo only through `inherit`.
    secrets: inherit
