# Products indexed into the vergil package repository (spec §7.1, §7.2).
# `vrg-package index` (run by .github/workflows/publish-index.yml) collects the
# stable releases of each product, verifies them, applies retention and
# publishes the signed apt/dnf site to GitHub Pages.
vendor = "vergil"
products = [
  "vergil-project/packages",
  "vergil-project/vergil-python",
  "vergil-project/vergil-tooling",
]

[retention]
# keep = 1 is an index-size stopgap: the site must stay under vrg-package
# index's 900 MB SIZE_FAIL once vergil-python ships two series per release
# (vergil-project/packages#28). Retention is revisited in vergil-project/.github#466.
keep = 1   # releases kept per major.minor line
lines = 2  # newest major.minor lines kept per product
# Exact package names dropped from the index (every format and arch).
# vergil-python3.14.8 is the legacy per-patch runtime from vergil-python@v1.0.0,
# superseded by the per-series vergil-python3.14 (vergil-project/vergil-python#37).
retire = ["vergil-python3.14.8"]
