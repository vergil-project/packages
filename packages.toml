# Products indexed into the vergil package repository (spec §7.1, §7.2).
# `vrg-package index` (run by .github/workflows/publish-index.yml) first selects
# the stable releases of each product that retention keeps, then downloads only
# those, drops the `retire` packages, verifies what remains and publishes the
# signed apt/dnf site to GitHub Pages.
vendor = "vergil"
products = [
  "vergil-project/packages",
  "vergil-project/vergil-python",
  "vergil-project/vergil-tooling",
]

[retention]
# keep = 2 keeps the previous release's packages in the pool, so a client
# still holding the index cached before a release (GitHub Pages serves it with
# max-age=600) can download the file that index names (vergil-project/packages#54).
# The site must stay under vrg-package index's 900 MB SIZE_FAIL: at keep = 2 it
# was about 482 MB in November 2026, but a second vergil-python major.minor line
# (lines = 2 keeps both) would take it past the limit. Retention is revisited in
# vergil-project/.github#466.
keep = 2   # releases kept per major.minor line
lines = 2  # newest major.minor lines kept per product
# Exact package names dropped from the index (every format and arch).
# vergil-python3.14.8 is the legacy per-patch runtime from vergil-python@v1.0.0,
# superseded by the per-series vergil-python3.14 (vergil-project/vergil-python#37).
retire = ["vergil-python3.14.8"]
