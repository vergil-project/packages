# nFPM overlay for vergil-archive-keyring (spec §5.2, §7.1). vrg-package owns
# the package identity; this file contributes only files and scripts.
#
# Both formats ship the public key as the apt Signed-By keyring. The apt source
# is not a static file: one .deb serves every Ubuntu codename, so postinst.sh
# writes it from /etc/os-release and postrm.sh removes it. RPM-only files go
# under overrides.rpm, which vrg-package merges into the rpm config only.
contents:
  - src: keys/vergil.asc
    dst: /usr/share/keyrings/vergil-archive-keyring.asc
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/postinst.sh
  postremove: packaging/postrm.sh
overrides:
  rpm:
    contents:
      - src: keys/vergil.asc
        dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-vergil
        file_info:
          mode: 0644
      - src: packaging/vergil.repo
        dst: /etc/yum.repos.d/vergil.repo
        type: config|noreplace
        file_info:
          mode: 0644
